# LLM Configuration
# Recommended models for 16GB VRAM:
#   qwen3:14b             (~9 GB)  — hybrid thinking, best overall (default)
#   mistral-small3.2:24b  (~14 GB) — Mistral Small 3.2, fits in 16 GB
#   deepseek-r1:14b       (~9 GB)  — strong chain-of-thought reasoning
#   phi4:14b              (~9 GB)  — Microsoft Phi-4, compact & capable
#   gemma3:12b            (~8 GB)  — Google Gemma 3 12B
#   qwen3:8b              (~5 GB)  — fast, still supports thinking mode
llm:
  model: "qwen3:14b"
  base_url: "http://localhost:11434"
  temperature: 0.3
  num_ctx: 8192

# Region configuration — drives market suffix, currency symbol, and LLM context
region:
  country: "IN"
  market: "NSE"          # NSE (National Stock Exchange) or BSE (Bombay Stock Exchange)
  currency: "INR"
  timezone: "Asia/Kolkata"
  name: "Hyderabad, India"

