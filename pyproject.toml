[project]
name = "stock-ez"
version = "0.1.0"
description = "AI-powered stock & fund recommendation agent for Indian markets"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "yfinance>=0.2.36",
    "feedparser>=6.0.11",
    "requests>=2.31.0",
    "pyyaml>=6.0.1",
    "rich>=13.7.0",
    "ollama>=0.4.0",
    "python-dateutil>=2.8.2",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.3.0",
    "streamlit>=1.35.0",
    "pandas>=2.0.0",
    "fpdf2>=2.7.9",
]

[dependency-groups]
dev = []

[tool.ruff.lint]
select = ["E", "F", "I"]
